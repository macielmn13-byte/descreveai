# Proxy reverso HTTPS do ContaGestão.
# Troque "seu-dominio.com.br" pelo seu domínio e coloque os certificados em
# docker/nginx/certs/ (fullchain.pem e privkey.pem) — veja o LEIAME.md.

upstream contagestao_api {
    server api:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name seu-dominio.com.br;

    # Validação do Let's Encrypt (certbot --webroot)
    location /.well-known/acme-challenge/ { root /var/www/acme; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name seu-dominio.com.br;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Deve ser >= MAX_UPLOAD_MB (+ folga para e-mails com vários anexos)
    client_max_body_size 260m;

    location / {
        proxy_pass http://contagestao_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
